name: Build and push Docker image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Repository secrets required: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.tataya6 }}
          password: ${{ secrets.dckr_pat_uBSpOeclXlGT0kr8IQGPent-WIs }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tacticus-tracker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tacticus-tracker:${{ github.sha }}
